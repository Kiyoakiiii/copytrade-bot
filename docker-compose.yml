x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      EMBEDDED_LOW_LATENCY_WATCHER_ENABLED: "false"
      DATABASE_POOL_SIZE: "8"
      DATABASE_MAX_OVERFLOW: "4"
      HYPERLIQUID_EXECUTION_SUBACCOUNT_ADDRESSES: ${HYPERLIQUID_EXECUTION_SUBACCOUNT_ADDRESSES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    expose:
      - "8000"

  watcher:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    cpu_shares: 2048
    logging: *default-logging
    env_file: .env
    environment:
      EMBEDDED_LOW_LATENCY_WATCHER_ENABLED: "false"
      DATABASE_POOL_SIZE: "12"
      DATABASE_MAX_OVERFLOW: "4"
      LOW_LATENCY_SUBMIT_DATABASE_POOL_SIZE: "8"
      LOW_LATENCY_SUBMIT_DATABASE_MAX_OVERFLOW: "4"
      WATCHER_STATUS_REFRESH_SECONDS: "5"
      HYPERLIQUID_EXECUTION_SUBACCOUNT_ADDRESSES: ${HYPERLIQUID_EXECUTION_SUBACCOUNT_ADDRESSES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.tasks.low_latency_worker"]

  watcher-subaccount:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    cpu_shares: 2048
    logging: *default-logging
    env_file: .env
    environment:
      EMBEDDED_LOW_LATENCY_WATCHER_ENABLED: "false"
      DATABASE_POOL_SIZE: "12"
      DATABASE_MAX_OVERFLOW: "4"
      LOW_LATENCY_SUBMIT_DATABASE_POOL_SIZE: "8"
      LOW_LATENCY_SUBMIT_DATABASE_MAX_OVERFLOW: "4"
      WATCHER_STATUS_REFRESH_SECONDS: "5"
      LOW_LATENCY_LEADER_ROUTE_MODE: "EXPLICIT"
      HYPERLIQUID_VAULT_ADDRESS: ""
      HYPERLIQUID_SUBACCOUNT_ADDRESS: ${HYPERLIQUID_SUBACCOUNT_ADDRESS:-}
      HYPERLIQUID_EXECUTION_SUBACCOUNT_ADDRESSES: ${HYPERLIQUID_EXECUTION_SUBACCOUNT_ADDRESSES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.tasks.low_latency_worker"]

  analytics:
    build:
      context: ./backend
    restart: unless-stopped
    cpu_shares: 128
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "0"
      HYPERLIQUID_INFO_URL: ${HYPERLIQUID_INFO_URL:-https://api.hyperliquid.xyz/info}
      HYPERLIQUID_ACCOUNT_ADDRESS: ${HYPERLIQUID_ACCOUNT_ADDRESS:-}
      HYPERLIQUID_VAULT_ADDRESS: ${HYPERLIQUID_VAULT_ADDRESS:-}
      HYPERLIQUID_SUBACCOUNT_ADDRESS: ${HYPERLIQUID_SUBACCOUNT_ADDRESS:-}
      LEADER_PERFORMANCE_REFRESH_ENABLED: "true"
      LEADER_PERFORMANCE_REFRESH_SECONDS: "21600"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.tasks.leader_performance_worker"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/htpasswd:/etc/nginx/htpasswd:ro

volumes:
  postgres_data:
  redis_data:
